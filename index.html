<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Cour Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout : une salle d'audience — dossier de l'affaire à gauche, transcription de l'audience à droite, barre d'action en bas. */
:root {
  --bg: #f3f4f1;
  --panel: #ffffff;
  --ink: #1b2420;
  --muted: #5d6a63;
  --line: #d9ded9;
  --accent: #14624d;        /* vert de la justice */
  --accent-soft: #e2efe9;
  --brass: #9a7426;          /* le juge */
  --brass-soft: #f4ecd9;
  --adverse: #8d2f2f;        /* l'avocat adverse */
  --adverse-soft: #f6e6e4;
  --good: #1f7a45;
  --warn: #a8670d;
  --bad: #b03030;
  --display: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
  --arabic: "Noto Naskh Arabic", "Segoe UI", Tahoma, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121815; --panel: #1a221e; --ink: #e6ebe7; --muted: #9aa8a0; --line: #2d3832;
  --accent: #4fbf98; --accent-soft: #1d3329; --brass: #d6b061; --brass-soft: #30291a;
  --adverse: #e58a83; --adverse-soft: #3a2220; --good: #5cc98a; --warn: #e0a34a; --bad: #ef7b7b;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121815; --panel: #1a221e; --ink: #e6ebe7; --muted: #9aa8a0; --line: #2d3832;
  --accent: #4fbf98; --accent-soft: #1d3329; --brass: #d6b061; --brass-soft: #30291a;
  --adverse: #e58a83; --adverse-soft: #3a2220; --good: #5cc98a; --warn: #e0a34a; --bad: #ef7b7b;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-wrap: balance; margin: 0; }
.eyebrow { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[lang="ar"] { font-family: var(--arabic); font-size: 1.08em; line-height: 1.9; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 20px; }
header.top h1 { font-size: 30px; letter-spacing: -.01em; }
header.top .logo { all: unset; cursor: pointer; }
header.top .logo:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
header.top h1 span { color: var(--accent); font-style: italic; font-weight: 400; }
.top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tag { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* --- Écran d'accueil : trois parcours en cartes --- */
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; transform: translateY(1px); display: inline-block; }
.accueil { display: grid; gap: 28px; }
.hero { display: grid; gap: 10px; padding: 18px 0 4px; }
.hero-titre { font-size: clamp(28px, 5vw, 44px); line-height: 1.1; letter-spacing: -.015em; max-width: 16em; }
.hero-sous { font-size: 16.5px; color: var(--muted); margin: 0; max-width: 40em; }
.parcours { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.carte { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; color: var(--ink);
  display: grid; gap: 8px; align-content: start; transition: border-color .15s, box-shadow .15s, transform .15s; }
.carte:hover:not(:disabled) { border-color: var(--accent); box-shadow: 0 6px 22px rgba(20, 98, 77, .12); transform: translateY(-2px); }
.carte strong { font-family: var(--display); font-size: 19px; }
.carte-texte { color: var(--muted); font-size: 14px; }
.carte-etat { font-size: 12.5px; color: var(--accent); font-weight: 600; margin-top: 6px; }
.carte:disabled { cursor: not-allowed; }
.carte:disabled > :not(.carte-etat) { opacity: .5; }
.carte:disabled .carte-etat { color: var(--warn); font-weight: 500; }
.carte-icone { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.carte-icone svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.code-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.code-form label { font-weight: 600; font-size: 14px; }
.code-form input { font: inherit; font-family: var(--mono); text-transform: uppercase; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; flex: 1; min-width: 12em; }
.lien-bouton { display: inline-block; text-decoration: none; }
.page-parcours { display: grid; gap: 18px; max-width: 760px; }
.retour { justify-self: start; background: none; border: 0; color: var(--muted); padding: 4px 0; font-size: 14px; }
.retour:hover { color: var(--accent); }
.entete-parcours { display: flex; gap: 14px; align-items: center; }
.entete-parcours h2 { font-size: 26px; }
.entete-parcours .hint { margin: 2px 0 0; }
.formulaire { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 20px; }
.champ { display: grid; gap: 8px; }
.champ-titre { font-weight: 600; font-size: 14.5px; }
.champ textarea { min-height: 0; }
.facultatif { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: 4px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--bg); border: 0; border-right: 1px solid var(--line); padding: 9px 8px; color: var(--ink); display: grid; gap: 1px; }
.seg button:last-child { border-right: 0; }
.seg button small { color: var(--muted); font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
.seg button[aria-pressed="true"] small { color: inherit; opacity: .85; }
.seg + .hint { margin: 0; }
.consentement { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--muted); }
.consentement input { margin-top: 3px; accent-color: var(--accent); }
.precision { border: 1px solid var(--brass); background: var(--brass-soft); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; }
.precision-question { margin: 0; font-weight: 600; }
.precision-libre { display: flex; gap: 8px; flex-wrap: wrap; }
.precision-libre input { flex: 1; min-width: 12em; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; }
.precision > .ghost { justify-self: start; }
.actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; color: var(--ink); font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.opt { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 11px 13px; color: var(--ink); display: grid; gap: 2px; }
.opt strong { font-weight: 600; }
.opt small { color: var(--muted); font-size: 13px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.opt:disabled { opacity: .55; cursor: not-allowed; }
.primary { background: var(--accent); color: var(--panel); border: 0; border-radius: 5px; padding: 12px 18px; font-weight: 600; }
.primary:disabled { opacity: .45; cursor: not-allowed; }
.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 5px; padding: 9px 14px; }
.disclaimer { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; margin: 0; }
.status { font-size: 13px; color: var(--muted); margin: 0; }
.status.err { color: var(--bad); }

/* --- Audience --- */
.court { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.dossier { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; }
.dossier h2 { font-size: 18px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.pieces { margin: 0; padding-left: 18px; font-size: 13.5px; display: grid; gap: 2px; }
.rounds { display: flex; gap: 6px; }
.rounds span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.rounds span.done { background: var(--accent); }
.rounds span.now { background: var(--brass); }
.scorebig { font-family: var(--display); font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1; }
.scorebig small { font-size: 15px; color: var(--muted); font-family: var(--body); }
.timer { font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }

.transcript { display: grid; gap: 12px; min-width: 0; }
.speech { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; min-width: 0; }
.speech .who { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; }
.speech p { margin: 0; }
.speech .quote { font-family: var(--display); font-size: 16px; line-height: 1.6; white-space: pre-wrap; }
.speech.adverse { border-left: 3px solid var(--adverse); }
.speech.adverse .who { color: var(--adverse); }
.speech.user { border-left: 3px solid var(--accent); background: var(--accent-soft); }
.speech.user .who { color: var(--accent); }
.speech.judge { border-left: 3px solid var(--brass); background: var(--brass-soft); }
.speech.judge .who { color: var(--brass); }
.speech.clerk { background: transparent; border: 1px dashed var(--line); }
.speech.clerk .who { color: var(--muted); }
.speech.pending { color: var(--muted); font-style: italic; display: grid; gap: 4px; }
.speech.pending .trace { font-style: normal; font-family: var(--mono); font-size: 12.5px; }
.note { margin-top: 8px; font-size: 13px; color: var(--muted); }
.cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.cite { font-family: var(--mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; color: var(--ink); }
.cite.ok::before { content: "✓ "; color: var(--good); }
.cite.ko { border-style: dashed; color: var(--muted); }
.cite.ko::before { content: "? "; color: var(--warn); }

.action { background: var(--panel); border: 1px solid var(--ink); border-radius: 6px; padding: 16px; display: grid; gap: 12px; }
.action h3 { font-size: 17px; }
.strat { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
.strat .opt { background: var(--panel); }
.strat .opt:hover { border-color: var(--accent); }
textarea, input[type=search] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; }
textarea { min-height: 140px; resize: vertical; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.hint { font-size: 13px; color: var(--muted); }

/* --- Tableau de bord --- */
.board { display: grid; gap: 20px; }
.verdict { background: var(--brass-soft); border: 1px solid var(--brass); border-radius: 6px; padding: 20px 22px; }
.verdict .quote { font-family: var(--display); font-size: 16.5px; line-height: 1.65; margin-top: 8px; white-space: pre-wrap; }
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.tile .num { font-family: var(--display); font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .num small { font-size: 15px; color: var(--muted); font-family: var(--body); }
.meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.num { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
ul.ok, ul.ko { margin: 0; padding-left: 18px; }
ul.ok li::marker { color: var(--good); }
ul.ko li::marker { color: var(--bad); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.pill.good { background: var(--accent-soft); color: var(--good); }
.pill.mid { background: var(--brass-soft); color: var(--warn); }
.pill.bad { background: var(--adverse-soft); color: var(--bad); }
.recruit { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 14px; }
.sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.sliders label { display: grid; gap: 4px; font-size: 14px; }
input[type=range] { accent-color: var(--accent); width: 100%; }
#exportBox { min-height: 200px; font-family: var(--mono); font-size: 12.5px; }

/* --- Panneau des codes --- */
.drawer { position: fixed; inset: 0 0 0 auto; width: min(560px, 100%); background: var(--panel); border-left: 1px solid var(--line);
  box-shadow: -12px 0 32px rgba(0,0,0,.18); z-index: 20; display: grid; grid-template-rows: auto auto minmax(0, 1fr);
  padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); gap: 12px; }
.drawer .row h2 { font-size: 20px; }
.results { overflow: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 16px; }
.res { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; color: var(--ink); display: grid; gap: 4px; }
.res .ref { font-family: var(--mono); font-size: 12.5px; color: var(--accent); font-weight: 500; }
.res .ext { font-size: 13.5px; color: var(--muted); }
.art-full { white-space: pre-wrap; font-size: 15px; line-height: 1.7; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 14px; }
.drawer.large { width: min(920px, 100%); grid-template-rows: auto auto minmax(0, 1fr); }
.lecteur-outils { display: grid; gap: 8px; }
.lecteur-champs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.lecteur-champs input[type=search] { flex: 1; min-width: 12em; width: auto; }
.lecteur-champs input:not([type]) { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; margin-left: 4px; }
.lecteur { gap: 0; }
.art-bloc { padding: 14px 4px; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
.art-titre { font-size: 16px; margin-bottom: 4px; white-space: normal; color: var(--accent); }
.art-titre .hint { font-family: var(--body); font-weight: 400; }
.lecteur .plus, .lecteur .moins { margin: 14px 0; justify-self: center; }
mark { background: var(--brass-soft); color: var(--ink); border-radius: 2px; padding: 0 1px; }
.liste-cas { display: grid; gap: 8px; max-height: 340px; overflow: auto; padding-right: 4px; }
.liste-cas .badge { vertical-align: 1px; margin-left: 4px; }
.badge { font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
.badge.abroge { color: var(--bad); border-color: var(--bad); }

@media (max-width: 820px) {
  .court, .parcours { grid-template-columns: 1fr; }
  .dossier { position: static; max-height: none; }
  .strat, .summary, .sliders { grid-template-columns: 1fr; }
  .formulaire { padding: 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .speech { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
}
</style>

<div class="wrap">
  <header class="top">
    <h1><button id="logo" class="logo" title="Accueil">Cour <span>Simulator</span></button></h1>
    <div class="top-actions">
      <span class="tag" id="baseStatus">Droit marocain</span>
      <button class="ghost" id="openCodes">Consulter les codes</button>
    </div>
  </header>
  <main id="app"></main>
</div>
<aside class="drawer" id="drawer" hidden></aside>

<script src="moteur.js"></script>
<script>
/* ============================================================
   BASE JURIDIQUE : chargement et recherche (FR + AR)
   ============================================================ */
// Le moteur (index, recherche, outils de Claude) est dans moteur.js, partagé avec le serveur local.
const BASE = Moteur;
const { rechercher, normCode, normArticle, trouverArticle, nomCourt, catalogue, outils } = Moteur;
let chargement = null;
// Ouverte depuis le disque (file://) ou dans l'APK, la page n'a pas le droit d'utiliser fetch :
// on charge alors la version .js du même fichier par une balise <script>.
function chargerParScript(p) {
  return new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = p.replace(/\.json$/, ".js");
    s.onload = () => (window.__COUR?.[p] ? ok(window.__COUR[p]) : ko(new Error(p)));
    s.onerror = () => ko(new Error(p));
    document.head.appendChild(s);
  });
}
const lireDonnees = p => location.protocol === "file:" ? chargerParScript(p)
  : fetch(p).then(r => { if (!r.ok) throw new Error(p); return r.json(); }).catch(() => chargerParScript(p));
function chargerBase() {
  if (chargement) return chargement;
  const statut = document.getElementById("baseStatus");
  statut.textContent = "Chargement des codes…";
  chargement = Moteur.charger(lireDonnees)
    .then(() => { statut.textContent = `${Object.keys(BASE.codes).length} textes · ${BASE.arts.length.toLocaleString("fr-FR")} articles${BASE.decisions.length ? ` · ${BASE.decisions.length} décisions` : ""}`; })
    .catch(e => { statut.textContent = "Codes indisponibles"; throw e; });
  return chargement;
}

/* ============================================================
   APPELS À CLAUDE
   Deux chemins : dans claude.ai, la capacité « sample » (compte Claude du joueur) ;
   en local, le serveur de Cour Simulator (clé API, voir serveur/serveur.js).
   ============================================================ */
let SAMPLE = null;
const IA = { mode: null, cle: true, serveurLocal: false, besoinCode: false, restant: null };   // mode : "sample" | "serveur" | null
const SERVEUR_LOCAL = "http://localhost:8787";
// Dans l'application Windows, le serveur est en ligne (adresse fournie par l'application) ; sinon même origine.
const APP = window.COUR_APP || null;
const BASE_API = APP?.serveur ? APP.serveur.replace(/\/$/, "") : "";
const codeBeta = {
  lire() { try { return localStorage.getItem("cour-code-beta") || ""; } catch { return ""; } },
  ecrire(v) { try { localStorage.setItem("cour-code-beta", v); } catch { /* stockage indisponible */ } IA.code = v; },
};
IA.code = codeBeta.lire();
const entetesApi = (extra = {}) => ({ ...extra, ...(IA.code ? { "X-Code-Beta": IA.code } : {}) });

async function verifierServeur() {
  try {
    const etat = await (await fetch(BASE_API + "/api/etat", { cache: "no-store", headers: entetesApi() })).json();
    if (!etat?.pret) return false;
    IA.mode = "serveur"; IA.cle = !!etat.cle;
    IA.besoinCode = !!etat.codeRequis && !etat.codeValide;
    IA.restant = etat.codeRequis && etat.codeValide ? etat.restant : null;
    IA.nom = etat.nom || "";
    return IA.cle && !IA.besoinCode;
  } catch { return false; }
}
let iaDispo = (async () => {
  if (!APP) { try { SAMPLE = await window.claude?.use?.("sample"); } catch { SAMPLE = null; } }
  if (SAMPLE) { IA.mode = "sample"; return true; }

async function demanderServeur(prompt, { trace, signal, json, sansOutils }) {
  let rep;
  try { rep = await fetch(BASE_API + "/api/demander", { method: "POST", headers: entetesApi({ "Content-Type": "application/json" }), body: JSON.stringify({ prompt, json, sansOutils }), signal }); }
  catch (e) { throw { code: e?.name === "AbortError" ? "cancelled" : "serveur_injoignable" }; }
  if (!rep.ok || !rep.body) throw { code: "serveur_injoignable" };
  // Le serveur répond une ligne JSON par étape : {"trace"} … puis {"resultat"} ou {"erreur"}.
  const lecteur = rep.body.getReader(), dec = new TextDecoder();
  let tampon = "";
  for (;;) {
    let r;
    try { r = await lecteur.read(); } catch (e) { throw { code: e?.name === "AbortError" ? "cancelled" : "serveur_injoignable" }; }
    if (r.done) break;
    tampon += dec.decode(r.value, { stream: true });
    const lignes = tampon.split("\n"); tampon = lignes.pop();
    for (const l of lignes) {
      if (!l.trim()) continue;
      const m = JSON.parse(l);
      if (m.trace) trace?.(m.trace);
      if (m.erreur) throw m.erreur;
      if ("resultat" in m) return m.resultat;
    }
  }
  throw { code: "serveur_injoignable" };
}

function puceCitations(citations = []) {
  const vues = new Set();
  const cle = c => c.decision ? "D|" + String(c.decision).toUpperCase() : normCode(c.code) + "|" + normArticle(c.article);
  const items = (citations || []).filter(c => c && (c.decision || (c.code && c.article))).filter(c => { const k = cle(c); if (vues.has(k)) return false; vues.add(k); return true; });

const parCode = new Map();
const articlesDe = cle => parCode.get(cle) || (parCode.set(cle, BASE.arts.filter(a => a.cle === cle)), parCode.get(cle));
const libelleArt = a => a.article ? `Article ${a.article}` : `Passage, page ${a.page}`;
// Le texte extrait garde les retours à la ligne du PDF : on recolle les lignes d'un même paragraphe
// (ligne précédente sans ponctuation finale, ou simple numéro d'alinéa « 1. », « a) »).
function paragraphes(texte, langue) {
  const lignes = texte.split("\n").map(l => l.trim()).filter(Boolean);
  if (langue === "AR") return lignes.join("\n");
  let out = "";
  for (const l of lignes) {
    if (!out) { out = l; continue; }
    const fin = out.slice(out.lastIndexOf("\n") + 1);
    const titre = /^(CHAPITRE|TITRE|SECTION|LIVRE|PARTIE|SOUS-SECTION)\b/.test(l) || /^[A-ZÀ-Ý0-9 ,'’:\-]{6,}$/.test(fin);
    const recoller = !titre && (!/[.;:!?»]$/.test(fin) || /^(\d+|[a-z]|[IVX]+)[.)°-]?$/.test(fin));
    out += (recoller ? (/[-‑]$/.test(fin) ? "" : " ") : "\n") + l;
  }
  return out.replace(/ ([,.;:)])/g, "$1");
}

        : `<p class="status err">Cette décision n'existe pas dans la base. La citation est peut-être inexacte.</p>`}
      <div class="row"><button class="ghost" id="dBack">${depuisListe ? "Toutes les décisions" : "Rechercher dans les codes"}</button></div>

// Lecteur d'un code entier : lecture continue (affichage par tranches au fil du défilement),
// accès direct à un article et recherche limitée à ce code.
async function lireCode(cle, depuis = 0) {
  drawer.hidden = false; drawer.classList.add("large");
  try { await chargerBase(); } catch { return; }
  const c = BASE.codes[cle], L = articlesDe(cle), ar = c.langue === "AR" ? 'lang="ar" dir="rtl"' : "";
  drawer.innerHTML = `
    <div class="row"><h2>${esc(c.principal ? cle + " · " : "")}${esc(c.titre)}</h2><button class="ghost" id="dClose">Fermer</button></div>
    <div class="lecteur-outils">
      <p class="hint" style="margin:0"><span class="badge">${c.langue}</span> ${c.version ? "version " + esc(c.version) + " · " : ""}${L.length} articles ${c.statut && /abrog/i.test(c.statut) ? '<span class="badge abroge">abrogé</span>' : ""}</p>
      <div class="lecteur-champs">
        <label class="hint" for="dGo">Aller à l'article <input id="dGo" inputmode="numeric" placeholder="259" style="width:7em"></label>
        <input type="search" id="dIn" placeholder="${c.langue === "AR" ? "Chercher en arabe dans ce texte… (ex. الحراسة النظرية)" : "Chercher dans ce texte…"}" aria-label="Chercher dans ce texte">
        <button class="ghost" id="dBack">Tous les codes</button>
      </div>
    </div>
    <div class="results lecteur" id="dLec"></div>`;
  drawer.querySelector("#dClose").onclick = fermerDrawer;
  drawer.querySelector("#dBack").onclick = () => ouvrirCodes();
  const zone = drawer.querySelector("#dLec");
  const bloc = (a, termes) => {
    let t = esc(paragraphes(a.texte.replace(/^\s*(Article|ARTICLE|Art\.|المادة|الفصل)\s*\S+\s*/, ""), c.langue));
    for (const m of termes) t = t.replace(new RegExp(`(${m.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi"), "<mark>$1</mark>");
    return `<article class="art-bloc" id="art-${L.indexOf(a)}"><h3 class="art-titre">${esc(libelleArt(a))} <span class="hint">p. ${a.page}</span></h3><div ${ar}>${t}</div></article>`;
  };
  // Lecture continue : on rend 40 articles à la fois, la suite quand on approche du bas.
  let debut = Math.max(0, depuis), fin = debut, obs = null;
  const suite = () => {
    const n = Math.min(L.length, fin + 40);
    zone.querySelector(".plus")?.remove();
    zone.insertAdjacentHTML("beforeend", L.slice(fin, n).map(a => bloc(a, [])).join(""));
    fin = n;
    if (fin < L.length) {
      zone.insertAdjacentHTML("beforeend", `<button class="ghost plus">Afficher la suite (${L.length - fin} articles)</button>`);
      const btn = zone.querySelector(".plus"); btn.onclick = suite; obs?.observe(btn);
    }
  };
  const avant = () => {
    const n = Math.max(0, debut - 40), haut = zone.scrollHeight;
    zone.querySelector(".moins")?.remove();
    zone.insertAdjacentHTML("afterbegin", L.slice(n, debut).map(a => bloc(a, [])).join(""));
    debut = n;
    zone.scrollTop += zone.scrollHeight - haut;
    if (debut > 0) { zone.insertAdjacentHTML("afterbegin", `<button class="ghost moins">Afficher les articles précédents (${debut})</button>`); zone.querySelector(".moins").onclick = avant; }
  };
  const lecture = (i = 0) => {
    zone.innerHTML = ""; debut = fin = Math.max(0, Math.min(i, L.length - 1));
    obs?.disconnect();
    obs = "IntersectionObserver" in window ? new IntersectionObserver(e => { if (e.some(x => x.isIntersecting)) suite(); }, { root: zone, rootMargin: "600px" }) : null;
    suite();
    if (debut > 0) { zone.insertAdjacentHTML("afterbegin", `<button class="ghost moins">Afficher les articles précédents (${debut})</button>`); zone.querySelector(".moins").onclick = avant; }
    zone.scrollTop = 0;
  };
  lecture(depuis);
  const go = drawer.querySelector("#dGo");
  go.onkeydown = e => {
    if (e.key !== "Enter") return;
    const a = trouverArticle(cle, go.value);
    if (a) { drawer.querySelector("#dIn").value = ""; lecture(L.indexOf(a)); }
    else go.setCustomValidity("Article introuvable"), go.reportValidity(), setTimeout(() => go.setCustomValidity(""), 1500);
  };
  const champ = drawer.querySelector("#dIn"); let t;
  champ.oninput = () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const v = champ.value.trim();
      if (!v) return lecture(0);
      obs?.disconnect();
      const trouves = rechercher(v, { code: cle, max: 60 });
      const termes = v.split(/\s+/).filter(m => m.length > 2);
      zone.innerHTML = trouves.length
        ? `<p class="hint">${trouves.length} article${trouves.length > 1 ? "s" : ""} trouvé${trouves.length > 1 ? "s" : ""}, du plus pertinent au moins pertinent. Cliquez un titre pour reprendre la lecture à cet endroit.</p>` + trouves.map(a => bloc(a, termes)).join("")
        : `<p class="status">Rien trouvé dans ce texte.</p>`;
      zone.querySelectorAll(".art-titre").forEach(h => { h.style.cursor = "pointer"; h.onclick = () => { champ.value = ""; lecture(+h.parentElement.id.slice(4)); }; });
    }, 220);
  };
}

async function analyserDemande(demande) {
  const prompt = `Tu prépares un entraînement à la plaidoirie en droit marocain. Un utilisateur demande ce cas pratique : « ${demande} ».
${REGLAGES.matiere ? `Matière déjà choisie : ${NOMS_MATIERES[REGLAGES.matiere]}.` : ""}

Si elle est vague, pose UNE question courte pour la préciser et propose 4 à 6 sous-thèmes concrets de ce domaine en droit marocain (ex. pour la famille : mariage, divorce, garde des enfants, pension alimentaire, filiation, successions).
Réponds uniquement par ce JSON :
{"precise":true,"matiere":"affaires|civil|penal|travail|famille|fiscal","resume":"le thème reformulé en une ligne","question":"","options":[]}`;
  return demander(prompt, { json: true, tier: "quick", sansOutils: true });
}

    f.querySelector("#casFiltres").innerHTML = Object.entries(NOMS_MATIERES).map(([k, l]) => {
      const n = k === "tous" ? CASES.length : CASES.filter(x => x.matiere === k).length;
      return n ? `<button class="chip" type="button" data-filtre="${k}" aria-pressed="${k === REGLAGES.filtre}">${l} (${n})</button>` : ""; }).join("");
    f.querySelectorAll("[data-filtre]").forEach(b => b.onclick = () => { REGLAGES.filtre = b.dataset.filtre; remplir(); });
    // Tous les mots de la recherche doivent apparaître (titre, faits, plaidoiries, articles cités).
    const mots = normRecherche(REGLAGES.recherche).split(/\s+/).filter(Boolean);
    const trouves = filtres().filter(k => { const t = texteCas(k); return mots.every(m => t.includes(m)); });
    if (!trouves.some(k => k.id === REGLAGES.caseId)) REGLAGES.caseId = trouves[0]?.id || null;
    f.querySelector("#casCompte").textContent = `${trouves.length} affaire${trouves.length > 1 ? "s" : ""}`;
    liste.innerHTML = trouves.length ? trouves.map(k => `
      <button class="opt" type="button" data-case="${k.id}" aria-pressed="${k.id === REGLAGES.caseId}">
        <strong>${esc(k.title)} <span class="badge">${NOMS_MATIERES[k.matiere]}</span></strong><small>${esc(k.object)} Vous êtes : ${esc(k.you)}.</small></button>`).join("")
      : `<p class="status">Aucune affaire ne correspond. Essayez d'autres mots, ou une autre matière.</p>`;
    f.querySelectorAll("[data-case]").forEach(b => b.onclick = () => { REGLAGES.caseId = b.dataset.case; pick(REGLAGES.caseId); });
  };
  const champ = f.querySelector("#rechercheCas"); let t;
  champ.oninput = () => { clearTimeout(t); t = setTimeout(() => { REGLAGES.recherche = champ.value; remplir(); }, 150); };
  casPrets.then(remplir);
  f.querySelector("#casHasard").onclick = () => {
    const choix = filtres(); if (!choix.length) return;
    REGLAGES.recherche = ""; champ.value = ""; REGLAGES.caseId = hasard(choix).id; remplir();
    f.querySelector(`[data-case="${REGLAGES.caseId}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
  };
  f.querySelector("#go").onclick = () => startTrial(REGLAGES.level, REGLAGES.caseId);
}

/* ============================================================
   ENREGISTREMENT DES AUDIENCES (base d'étude)
   claude.ai : base de données de la page (lisible par le seul propriétaire) ;
   serveur : fichier côté serveur ; sinon : copie sur cet appareil.
   ============================================================ */
async function enregistrerAudience(verdict, pct) {
  const tronquer = (s, n) => String(s ?? "").slice(0, n);
  const fiche = {
    cree: new Date().toISOString(), parcours: S.parcours, niveau: S.level, cote: S.cote, matiere: S.matiere || "",
    demande: tronquer(S.demande, 1000), precision: tronquer(S.precision, 500),
    faits: tronquer(S.faits, 6000), pieces: tronquer(S.pieces, 2000), position: tronquer(S.position, 2000),
    affaire: S.affaire || null,
    plaidoiries: S.log.filter(l => l.kind === "user").map(l => tronquer(l.text, 4000)),
    echanges: S.log.filter(l => l.kind !== "clerk").map(l => ({ qui: l.who, texte: tronquer(l.text, 3000) })),
    rounds: S.results.map(r => ({ nom: r.name, score: r.score, reussites: r.ok, failles: r.ko })),
    verdict: { texte: tronquer(verdict.text, 4000), issue: verdict.issue || "" }, pertinence: pct,
  };
  try { const l = JSON.parse(localStorage.getItem("cour-audiences") || "[]"); l.unshift(fiche); localStorage.setItem("cour-audiences", JSON.stringify(l.slice(0, 20))); } catch { /* stockage indisponible */ }
  try {
    if (IA.mode === "sample") {
      const db = await window.claude?.use?.("db");
      if (!db) return "local";
      await db.collection("audiences").add(fiche);
      return "partage";
    }
    if (IA.mode === "serveur") {
      const r = await fetch(BASE_API + "/api/audiences", { method: "POST", headers: entetesApi({ "Content-Type": "application/json" }), body: JSON.stringify(fiche) });
      return r.ok ? "partage" : "local";
    }
  } catch { /* enregistrement partagé impossible : la copie locale reste */ }
  return "local";
}

function ouvrirSalle() {
  app.innerHTML = `<section class="court"><aside class="dossier" id="dossier"></aside><div class="transcript" id="transcript"></div></section>`;
}

function renderDossier() {
  const c = S.c, total = S.results.reduce((s, r) => s + r.score, 0), max = S.results.length * 20;
  document.getElementById("dossier").innerHTML = `
    <div><p class="eyebrow">Dossier${S.ia ? " · audience IA" : ""}</p><h2>${esc(c.title)}</h2></div>
    <dl class="kv">
      <dt>Juridiction</dt><dd>${esc(c.court)}</dd>
      <dt>Objet</dt><dd>${esc(c.object)}</dd>
      <dt>Votre rôle</dt><dd>${esc(c.you)}</dd>
      <dt>Niveau</dt><dd>${NIVEAUX[S.level].label}</dd>
    </dl>
    ${c.pieces?.length ? `<div><p class="eyebrow">Pièces du dossier</p><ul class="pieces">${c.pieces.map(p => `<li>${esc(p.nom || p)}</li>`).join("")}</ul></div>` : ""}
    <div>
      <p class="eyebrow">Round ${Math.min(S.round + 1, 3)} / 3</p>
      <div class="rounds">${[0, 1, 2].map(i => `<span class="${i < S.results.length ? "done" : i === S.round ? "now" : ""}"></span>`).join("")}</div>
    </div>

}

function say(kind, who, html, extra = "", texteBrut = null) {
  const el = document.createElement("article");
  el.className = "speech " + kind;
  el.innerHTML = `<div class="who"><span class="dot" style="background:currentColor"></span>${esc(who)}</div>
    <p class="${kind === "clerk" ? "" : "quote"}">${html}</p>${extra}`;
  document.getElementById("transcript").appendChild(el);
  S.log.push({ kind, who, text: texteBrut ?? el.querySelector("p").textContent });
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  return el;
}

function attente(who) {
  const el = document.createElement("article");
  el.className = "speech pending";
  el.innerHTML = `<span>${esc(who)}</span><span class="trace"></span>`;
  document.getElementById("transcript").appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  return { el, trace: t => { el.querySelector(".trace").textContent = "↳ " + t; }, fin: () => el.remove() };
}
async function thinking(who, ms = 900) { const a = attente(`${who} prend la parole…`); await sleep(ms); a.fin(); }

function startTimer() {
  stopTimer(); S.timeLeft = TIME_LIMIT;
  const tick = () => {
    const el = document.getElementById("timer"); if (!el) return;
    const t = Math.max(0, S.timeLeft), m = Math.floor(t / 60), s = String(t % 60).padStart(2, "0");
    el.textContent = S.timeLeft >= 0 ? `${m}:${s}` : `+${-S.timeLeft}s`;
    el.classList.toggle("low", S.timeLeft <= 30);
    S.timeLeft--;
  };
  tick(); timerId = setInterval(tick, 1000);
}
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }

function zoneSaisie(r, onPlead) {
  const box = document.createElement("section");
  box.className = "action"; box.id = "action";
  box.innerHTML = `
    <div><p class="eyebrow">Round ${S.round + 1} · ${esc(r.name)}</p><h3>${esc(r.prompt)}</h3></div>
    <textarea id="arg" placeholder="Monsieur le Président, …"></textarea>
    <div class="row">
      <span class="hint" id="count">0 mot · ${S.level === "difficile" ? "citez les articles de loi précis" : "un raisonnement logique suffit"}</span>
      <button class="primary" id="plead" disabled>Plaider</button>
    </div>`;
  const ta = box.querySelector("#arg"), btn = box.querySelector("#plead"), cnt = box.querySelector("#count");
  ta.oninput = () => {
    const n = ta.value.trim().split(/\s+/).filter(Boolean).length;
    cnt.textContent = `${n} mot${n > 1 ? "s" : ""} · ${S.level === "difficile" ? "citez les articles de loi précis" : "un raisonnement logique suffit"}`;
    btn.disabled = n < 5;
  };
  btn.onclick = () => onPlead(ta.value.trim());
  document.getElementById("transcript").appendChild(box);
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  if (S.level === "difficile") startTimer(); else ta.focus({ preventScroll: true });
}

function erreurIA(e, relancer) {
  const box = document.createElement("section");
  box.className = "action"; box.id = "action";
  box.innerHTML = `<p class="status err">${esc(messageErreur(e))}</p>
    <div class="row"><button class="ghost" id="quitErr">Revenir à l'accueil</button>${relancer && !["not_granted", "sampling_disabled"].includes(e?.code) ? '<button class="primary" id="retry">Réessayer</button>' : ""}</div>`;
  document.getElementById("transcript").appendChild(box);
  box.querySelector("#quitErr").onclick = renderIntro;
  box.querySelector("#retry")?.addEventListener("click", () => { box.remove(); relancer(); });
}

// opts : { parcours: "ia", demande, precision } ou { parcours: "moncas", faits, pieces, position }.
async function startIA(opts) {
  const st = document.getElementById("startStatus");

  const cote = REGLAGES.cote === "hasard" ? hasard(["defense", "demande"]) : REGLAGES.cote;
  S = { ia: true, level: REGLAGES.level, matiere: REGLAGES.matiere, cote, enregistrer: REGLAGES.enregistrer, round: 0, log: [], results: [], busy: false,

// Consigne de création de l'affaire selon le parcours choisi.
function consigneAffaire() {
  const matiere = S.matiere ? `Matière : ${MATIERES[S.matiere]}.` : "Matière : choisis-la d'après la demande (affaires, civil, pénal, travail, famille ou fiscal).";
  if (S.parcours === "moncas") return `Tâche : construis le dossier d'audience à partir de la situation RÉELLE exposée par l'utilisateur. Garde fidèlement ses faits, ses dates, ses montants et ses pièces : ne les contredis pas et n'ajoute que le strict nécessaire pour une audience (noms fictifs des parties, juridiction compétente, éventuelle pièce adverse plausible). Si un élément manque, choisis l'hypothèse la plus vraisemblable et dis-le dans les faits (« selon les éléments fournis… »).
${matiere}
Faits exposés par l'utilisateur : « ${S.faits} »
${S.pieces ? `Pièces dont il dispose : « ${S.pieces} »` : ""}
${S.position ? `Ce qu'il demande ou conteste : « ${S.position} »` : ""}`;
  const graines = { ville: hasard(VILLES), montant: (Math.floor(Math.random() * 40) + 3) * 25000,
    preuve_forte_pour: hasard(["l'utilisateur", "l'adversaire", "personne de façon décisive"]), faiblesse: hasard(["la procédure", "la preuve", "le fond", "le montant", "la qualification"]) };
  const demande = S.demande ? `Demande de l'utilisateur : « ${S.demande} »${S.precision ? ` ; précision : « ${S.precision} »` : ""}. Respecte-la : l'affaire doit porter exactement sur ce thème${/hasard/.test(S.precision) ? " (sujet précis à ton choix dans ce domaine)" : ""}.` : "Aucun thème imposé : choisis un sujet original.";
  return `Tâche : invente une affaire réaliste et ORIGINALE à plaider, en t'appuyant sur les textes de la base.
${matiere}
${demande}
Éléments imposés pour varier les affaires : ville ${graines.ville} ; enjeu de l'ordre de ${graines.montant.toLocaleString("fr-FR")} DH s'il y a un enjeu financier ; les pièces favorisent ${graines.preuve_forte_pour} ; le point faible principal de l'utilisateur porte sur ${graines.faiblesse}.`;
}

async function preparerAffaire() {
  const a = attente("Le greffe constitue le dossier…");
  CTL = new AbortController();
  const prompt = `${cadre()}

${consigneAffaire()}
L'utilisateur plaide pour : ${S.cote === "defense" ? "la DÉFENSE (le défendeur / le prévenu)" : "la DEMANDE (le demandeur / la partie civile)"}.
${NIVEAUX[S.level].consigne}
Avant de répondre, utilise chercher_articles puis lire_article pour choisir 3 à 5 articles réellement applicables (au moins un texte arabe si la matière s'y prête, par exemple le CPP en pénal ou la Moudawana en famille).

Réponds uniquement par ce JSON :
{"titre":"Partie A c/ Partie B","juridiction":"…","objet":"une phrase","faits":"120 à 180 mots, avec dates et montants","partie_utilisateur":"nom et qualité de la partie défendue par l'utilisateur","partie_adverse":"nom et qualité","pieces":[{"nom":"pièce versée au dossier","favorable_a":"utilisateur|adverse|neutre"}],"questions":["question juridique 1","question 2","question 3"],"articles_cles":[{"code":"DOC","article":"259"}]}`;
  try {
    const af = await demander(prompt, { trace: a.trace, signal: CTL.signal });
    a.fin();
    if (!af || !af.titre || !af.faits) throw { code: "invalid_json" };
    S.affaire = af;
    S.c = { title: af.titre, court: af.juridiction || "—", object: af.objet || "", you: `${S.cote === "defense" ? "Défense" : "Demande"} — ${af.partie_utilisateur || ""}`,
      adverseName: `Avocat de ${(af.partie_adverse || "la partie adverse").split(",")[0]}`, pieces: af.pieces || [] };
    renderDossier();
    say("clerk", "Greffier", `L'audience est ouverte. Affaire <strong>${esc(af.titre)}</strong> — ${esc(af.juridiction)}.<br><br>${esc(af.faits)}`,
      af.questions?.length ? `<p class="note">Questions à trancher : ${af.questions.map(esc).join(" · ")}</p>` : "");
    tourAdverse();
  } catch (e) { a.fin(); if (e?.code !== "cancelled") erreurIA(e, preparerAffaire); }
}

const NOMS_ROUNDS = ["Plaidoirie d'ouverture", "Réplique et contre-attaque", "Dernières observations"];

async function tourAdverse() {
  renderDossier();
  const a = attente(`${S.c.adverseName} prépare sa plaidoirie…`);
  CTL = new AbortController();
  const faillesPrec = S.results.at(-1)?.ko?.length ? `Failles relevées par le juge au round précédent, à exploiter : ${S.results.at(-1).ko.join(" ; ")}` : "";
  const prompt = `${cadre()}

Affaire (JSON) : ${JSON.stringify(S.affaire)}
Transcription de l'audience jusqu'ici :
${resumeAudience() || "(début de l'audience)"}

Tu es l'AVOCAT DE ${S.affaire.partie_adverse}. Round ${S.round + 1}/3 : ${NOMS_ROUNDS[S.round]}.
${NIVEAUX[S.level].consigne}
${faillesPrec}
Plaide à l'oral, en français, 120 à 200 mots, style d'audience marocaine (« Monsieur le Président… »). Appuie-toi sur 1 à 3 articles vérifiés avec lire_article ; réponds aux arguments de l'utilisateur s'il en a présenté.
${S.level === "facile" ? `Propose aussi à l'utilisateur DEUX réponses possibles : une solide (bien fondée en droit, qui répond à ta plaidoirie) et une plus faible mais plausible (erreur de stratégie typique d'un débutant). Ordre aléatoire. Pour chacune : la plaidoirie complète (80 à 140 mots) et son évaluation par un juge.` : ""}

Réponds uniquement par ce JSON :
{"plaidoirie":"…","citations":[{"code":"…","article":"…"}]${S.level === "facile" ? `,"options":[{"titre":"3 à 6 mots","resume":"une phrase","plaidoirie":"…","citations":[{"code":"…","article":"…"}],"score":0,"points_forts":["…"],"failles":["…"]}]` : ""}}`;
  try {
    const rep = await demander(prompt, { trace: a.trace, signal: CTL.signal });
    a.fin();
    if (!rep?.plaidoirie) throw { code: "invalid_json" };
    say("adverse", S.c.adverseName, `« ${esc(rep.plaidoirie)} »`, puceCitations(rep.citations), rep.plaidoirie);
    S.tour = { name: NOMS_ROUNDS[S.round], prompt: S.round === 0 ? "Présentez votre plaidoirie en réponse." : "Répondez à l'avocat adverse.", adverse: rep };
    if (S.level === "facile" && Array.isArray(rep.options) && rep.options.length >= 2) proposerOptions(rep.options.slice(0, 2));
    else zoneSaisie(S.tour, plaiderIA);
  } catch (e) { a.fin(); if (e?.code !== "cancelled") erreurIA(e, tourAdverse); }
}

function proposerOptions(options) {
  const box = document.createElement("section");
  box.className = "action"; box.id = "action";
  box.innerHTML = `
    <div><p class="eyebrow">Round ${S.round + 1} · ${esc(S.tour.name)}</p><h3>${esc(S.tour.prompt)}</h3></div>
    <p class="hint">Deux stratégies fondées sur les textes. Choisissez celle que vous plaidez.</p>
    <div class="strat">${options.map((o, i) => `<button class="opt" data-i="${i}"><strong>${esc(o.titre)}</strong><small>${esc(o.resume)}</small></button>`).join("")}</div>`;
  box.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
    const o = options[+b.dataset.i]; box.remove();
    say("user", "Vous — " + S.c.you, `« ${esc(o.plaidoirie)} »`, puceCitations(o.citations) + `<p class="note">Stratégie choisie : ${esc(o.titre)}</p>`, o.plaidoirie);
    const score = Math.max(0, Math.min(20, Math.round(Number(o.score) || 0)));
    conclureRound({ score, ok: o.points_forts || [], ko: o.failles || [], argument: `${o.titre} — ${o.plaidoirie}`,
      appreciation: score >= 14 ? "Le tribunal prend note d'une argumentation bien fondée." : score >= 9 ? "L'argument est entendu, mais il laisse des points sans réponse." : "Le tribunal n'est pas convaincu par cette stratégie.",
      manques: [], citations: o.citations || [] });
  });
  document.getElementById("transcript").appendChild(box);
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function plaiderIA(texte) {
  const overtime = S.level === "difficile" && S.timeLeft < 0;
  stopTimer();
  document.getElementById("action")?.remove();
  say("user", "Vous — " + S.c.you, `« ${esc(texte)} »`, "", texte);
  juger(texte, overtime);
}

async function juger(texte, overtime) {
  const a = attente("Le juge vérifie les textes invoqués…");
  CTL = new AbortController();
  const prompt = `${cadre()}

Affaire (JSON) : ${JSON.stringify(S.affaire)}
Transcription :
${resumeAudience()}

Tu es le JUGE, impartial. Évalue UNIQUEMENT la dernière plaidoirie de l'utilisateur (round ${S.round + 1}/3), qui défend ${S.affaire.partie_utilisateur} :
« ${texte} »
${NIVEAUX[S.level].consigne}${overtime ? "\nL'utilisateur a dépassé son temps de parole : retire 3 points." : ""}
Vérifie avec lire_article chaque article qu'il cite (existe-t-il ? dit-il bien cela ? est-il en vigueur ?). Cherche aussi les articles qu'il aurait dû invoquer.
Note sur 20 : pertinence juridique, réponse aux arguments adverses, usage des pièces, exactitude des citations, structure.

Réponds uniquement par ce JSON :
{"score":0,"appreciation":"1 à 2 phrases prononcées à l'audience","points_forts":["…"],"failles":["…"],"citations_utilisateur":[{"code":"…","article":"…","exacte":true,"commentaire":"…"}],"articles_manques":[{"code":"…","article":"…","raison":"…"}]}`;
  try {
    const ev = await demander(prompt, { trace: a.trace, signal: CTL.signal });
    a.fin();
    if (!ev || typeof ev.score === "undefined") throw { code: "invalid_json" };
    const ko = [...(ev.failles || []), ...(ev.citations_utilisateur || []).filter(c => c.exacte === false).map(c => `Citation inexacte : ${c.code} art. ${c.article}${c.commentaire ? " — " + c.commentaire : ""}`)];
    conclureRound({ score: Math.max(0, Math.min(20, Math.round(Number(ev.score) || 0))), ok: ev.points_forts || [], ko, argument: texte,
      appreciation: ev.appreciation || "", manques: ev.articles_manques || [], citations: ev.citations_utilisateur || [] });
  } catch (e) { a.fin(); if (e?.code !== "cancelled") erreurIA(e, () => juger(texte, overtime)); }
}

function conclureRound(res) {
  const b = band(res.score, 20);
  const manques = res.manques?.length ? `<p class="note">Textes qui auraient renforcé votre plaidoirie :</p>${puceCitations(res.manques)}` : "";
  say("judge", "Le juge", `« ${esc(res.appreciation)} »`, `<p class="note"><span class="pill ${b}">${bandLabel[b]}</span> &nbsp;Round ${S.round + 1} : ${res.score} / 20</p>${manques}`, res.appreciation);
  S.results.push({ name: S.tour.name, ...res });
  S.round++;
  renderDossier();
  if (S.round < 3) tourAdverse(); else verdictIA();
}

async function verdictIA() {
  const a = attente("Le tribunal délibère…");
  CTL = new AbortController();
  const total = S.results.reduce((s, r) => s + r.score, 0), pct = Math.round(total / 60 * 100);
  const prompt = `${cadre()}

Affaire (JSON) : ${JSON.stringify(S.affaire)}
Transcription complète :
${resumeAudience()}
Scores de l'utilisateur par round : ${S.results.map(r => r.score + "/20").join(", ")} (pertinence globale ${pct}/100).

Tu es le TRIBUNAL. Rends le jugement de cette affaire, cohérent avec la qualité des plaidoiries (plus l'utilisateur a été convaincant, plus la décision lui est favorable) et avec les textes, que tu vérifies avec lire_article.
Style des jugements marocains : « Le Tribunal, Attendu que… ; Attendu que… ; Par ces motifs : … ». 150 à 250 mots.
Ajoute 2 à 4 conseils personnels pour progresser.

Réponds uniquement par ce JSON :
{"jugement":"…","issue":"favorable|partiellement favorable|défavorable","citations":[{"code":"…","article":"…"}],"conseils":["…"]}`;
  try {
    const v = await demander(prompt, { trace: a.trace, signal: CTL.signal });
    a.fin();
    if (!v?.jugement) throw { code: "invalid_json" };
    say("judge", "Le juge — verdict", "L'audience est close. Le tribunal a délibéré.");
    await sleep(500);
    const verdict = { text: v.jugement, issue: v.issue, citations: v.citations, conseils: v.conseils };
    const sauvegarde = S.enregistrer ? enregistrerAudience(verdict, pct) : null;
    renderBoard(pct, verdict);
    sauvegarde?.then(ou => {
      const el = document.getElementById("sauvegarde"); if (!el) return;
      el.textContent = ou === "partage" ? "Audience enregistrée dans la base d'étude de Cour Simulator." : "Audience enregistrée sur cet appareil.";
    });
  } catch (e) { a.fin(); if (e?.code !== "cancelled") erreurIA(e, verdictIA); }
}

/* ============================================================
   DÉMO HORS LIGNE (sans IA)
   ============================================================ */
async function startTrial(level, caseId) {
  await casPrets;
  const c = CASES.find(x => x.id === caseId);
  if (!c) { const st = document.getElementById("startStatus"); if (st) { st.className = "status err"; st.textContent = "Choisissez une affaire dans la liste."; } return; }
  S = { ia: false, level, c, round: 0, log: [], results: [], busy: false };
  ouvrirSalle(); renderDossier();
  say("clerk", "Greffier", `L'audience est ouverte. Affaire <strong>${esc(c.title)}</strong> — ${esc(c.court)}. ${esc(c.facts)}`);
  playRound();
}

function gradeText(round, text, level, overtime) {
  const t = norm(text), words = t.split(/\s+/).filter(Boolean).length, ok = [], ko = [];
  let concepts = 0, keyHit = false;
  for (const c of round.concepts) { if (c.re.test(t)) { concepts += c.pts; ok.push(c.label); if (c.key) keyHit = true; } else ko.push(c.label + " : absent"); }
  let arts = 0;
  for (const a of round.articles) { if (a.re.test(t)) { arts += a.pts; ok.push("Cite " + a.label); } else if (level === "difficile") ko.push("Article attendu : " + a.label); }
  // Note relative au maximum du round (les rounds n'ont pas tous le même nombre de concepts ni d'articles).
  const maxConcepts = round.concepts.reduce((s, c) => s + c.pts, 0) || 1, maxArts = round.articles.reduce((s, a) => s + a.pts, 0);
  let score;
  if (level === "moyen") score = Math.min(20, Math.round(concepts / maxConcepts * 20) + arts);
  else {
    score = maxArts ? Math.round(concepts / maxConcepts * 12) + Math.round(arts / maxArts * 8) : Math.round(concepts / maxConcepts * 20);
    if (overtime) { score -= 3; ko.push("Temps de parole dépassé (−3)"); }
  }
  if (words < 25) { score -= 3; ko.push("Argumentation trop courte (moins de 25 mots, −3)"); }
  return { score: Math.max(0, Math.min(20, score)), ok, ko, keyHit };
}

async function playRound() {
  const r = S.c.rounds[S.round];
  renderDossier();
  await thinking(S.c.adverseName);
  say("adverse", S.c.adverseName, `« ${esc(r.adverse)} »`);
  if (S.level === "facile") {
    const box = document.createElement("section");
    box.className = "action"; box.id = "action";
    box.innerHTML = `
      <div><p class="eyebrow">Round ${S.round + 1} · ${esc(r.name)}</p><h3>${esc(r.prompt)}</h3></div>
      <p class="hint">Deux stratégies tirées de la jurisprudence. Choisissez celle que vous plaidez.</p>
      <div class="strat">${r.options.map((o, i) => `<button class="opt" data-i="${i}"><strong>${esc(o.label)}</strong><small>${esc(o.detail)}</small></button>`).join("")}</div>`;
    box.querySelectorAll("[data-i]").forEach(b => b.onclick = () => submitOption(r, r.options[+b.dataset.i]));
    document.getElementById("transcript").appendChild(box);
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  } else zoneSaisie(r, txt => submitText(r, txt));
}

async function submitOption(r, o) {
  if (S.busy) return; S.busy = true;
  document.getElementById("action").remove();
  say("user", "Vous — " + S.c.you, `« ${esc(o.speech)} »`, `<p class="note">Stratégie choisie : ${esc(o.label)}</p>`);
  await resolveRound(r, { score: o.pts, ok: o.ok, ko: o.ko, keyHit: o.pts >= 14, argument: o.label + " — " + o.speech });
}

async function submitText(r, text) {
  if (S.busy) return; S.busy = true;
  const overtime = S.level === "difficile" && S.timeLeft < 0;
  stopTimer();
  document.getElementById("action").remove();
  say("user", "Vous — " + S.c.you, `« ${esc(text)} »`);
  await resolveRound(r, { ...gradeText(r, text, S.level, overtime), argument: text });
}

async function resolveRound(r, res) {
  const b = band(res.score, 20);
  await thinking("Le juge", 800);
  const lignes = { good: "Le tribunal prend note d'une argumentation précise et étayée.", mid: "L'argument est entendu, mais il laisse des points sans réponse.", bad: "Le tribunal n'est pas convaincu par cette argumentation." };
  let judge = lignes[b];
  if (S.level === "difficile" && !res.ok.some(x => x.startsWith("Cite"))) judge += " Le tribunal relève qu'aucun texte précis n'a été cité.";
  const textes = r.articles?.length ? `<p class="note">Textes applicables à ce round :</p>${puceCitations(r.articles)}` : "";
  say("judge", "Le juge", `« ${judge} »`, `<p class="note"><span class="pill ${b}">${bandLabel[b]}</span> &nbsp;Round ${S.round + 1} : ${res.score} / 20</p>${textes}`);
  S.results.push({ name: r.name, ...res, manques: r.articles || [] });
  if (S.round < 2 || !res.keyHit || S.level === "difficile") {
    await thinking(S.c.adverseName, 700);
    const exploit = !res.keyHit || (S.level === "difficile" && res.score < 14);
    say("adverse", S.c.adverseName, `« ${esc(exploit ? r.faille : r.concede)} »`);
    if (exploit) S.results[S.results.length - 1].ko = [...res.ko, "Faille exploitée par l'adversaire"];
  }
  S.round++; S.busy = false;
  if (S.round < 3) playRound(); else finish();
}

async function finish() {
  renderDossier();
  const total = S.results.reduce((s, r) => s + r.score, 0), pct = Math.round(total / 60 * 100);
  const v = S.c.verdicts.find(x => pct >= x.min);
  await thinking("Le juge", 1200);
  say("judge", "Le juge — verdict", "L'audience est close. Le tribunal se retire pour délibérer.");
  await sleep(600);
  renderBoard(pct, v);
}

/* ============================================================
   TABLEAU DE BORD
   ============================================================ */
function renderBoard(pct, v) {
  stopTimer();
  const b = pct >= 75 ? "good" : pct >= 45 ? "mid" : "bad";
  const best = S.results.reduce((a, r) => r.score > a.score ? r : a), worst = S.results.reduce((a, r) => r.score < a.score ? r : a);
  app.innerHTML = `
    <section class="board">
      <div class="verdict">
        <p class="eyebrow">Verdict · ${esc(S.c.court)}${v.issue ? " · issue " + esc(v.issue) : ""}</p>
        <h2>${esc(S.c.title)}</h2>
        <p class="quote">« ${esc(v.text)} »</p>
        ${puceCitations(v.citations)}
        ${S.enregistrer ? `<p class="note" id="sauvegarde">Enregistrement de l'audience…</p>` : ""}
      </div>
      <div class="summary">
        <div class="tile"><span class="eyebrow">Pertinence juridique</span><span class="num">${pct}<small> / 100</small></span>
          <div class="meter"><i style="width:${pct}%"></i></div><span><span class="pill ${b}">${bandLabel[b]}</span></span></div>
        <div class="tile"><span class="eyebrow">Meilleur round</span><span class="num">${best.score}<small> / 20</small></span><span class="hint">${esc(best.name)}</span></div>
        <div class="tile"><span class="eyebrow">Round le plus faible</span><span class="num">${worst.score}<small> / 20</small></span><span class="hint">${esc(worst.name)}</span></div>
      </div>
      ${v.conseils?.length ? `<div class="recruit"><p class="eyebrow">Conseils du juge pour progresser</p><ul class="ok">${v.conseils.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
      <div>
        <p class="eyebrow" style="margin-bottom:8px">Analyse round par round · niveau ${NIVEAUX[S.level].label}</p>
        <div class="tablewrap"><table>
          <thead><tr><th>Round</th><th>Score</th><th>Arguments réussis</th><th>Failles laissées ouvertes</th>${S.ia ? "<th>Textes à invoquer</th>" : ""}</tr></thead>
          <tbody>${S.results.map((r, i) => `
            <tr>
              <td><strong>${i + 1}. ${esc(r.name)}</strong></td>
              <td class="num"><span class="pill ${band(r.score, 20)}">${r.score} / 20</span></td>
              <td>${r.ok.length ? `<ul class="ok">${r.ok.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "<span class='hint'>Aucun</span>"}</td>
              <td>${r.ko.length ? `<ul class="ko">${r.ko.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "<span class='hint'>Aucune</span>"}</td>
              ${S.ia ? `<td>${puceCitations(r.manques) || "<span class='hint'>—</span>"}</td>` : ""}
            </tr>`).join("")}</tbody>
        </table></div>
      </div>
      <div class="recruit">
        <div><p class="eyebrow">Annotations du recruteur</p><h3 style="font-size:17px">Évaluation humaine</h3></div>
        <div class="sliders">
          <label for="stress">Gestion du stress : <strong id="stressV">3</strong> / 5<input type="range" id="stress" min="1" max="5" value="3"></label>
          <label for="posture">Posture et éloquence : <strong id="postureV">3</strong> / 5<input type="range" id="posture" min="1" max="5" value="3"></label>
        </div>
        <label for="notes" class="hint">Commentaires libres</label>
        <textarea id="notes" placeholder="Ex. : bonne réactivité sur la mise en demeure, manque d'assurance au round 3."></textarea>
        <div class="row">
          <span class="hint">Le dossier d'évaluation se met à jour avec vos annotations.</span>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="ghost" id="copy">Copier le dossier</button>
            <button class="primary" id="again">Nouvelle audience</button>
          </div>
        </div>
        <label for="exportBox" class="hint">Dossier d'évaluation complet</label>
        <textarea id="exportBox" readonly></textarea>
      </div>
    </section>`;
  const build = () => {
    const st = document.getElementById("stress").value, po = document.getElementById("posture").value;
    document.getElementById("stressV").textContent = st;
    document.getElementById("postureV").textContent = po;
    const refs = l => (l || []).filter(c => c?.code).map(c => `${c.code} art. ${c.article}`).join(", ");
    document.getElementById("exportBox").value = [
      "DOSSIER D'ÉVALUATION — COUR SIMULATOR",
      `Affaire : ${S.c.title} (${S.c.court})`,
      `Rôle : ${S.c.you} · Niveau : ${NIVEAUX[S.level].label}${S.ia ? " · audience IA" : ""}`,
      `Date : ${new Date().toLocaleDateString("fr-FR")}`, "",
      `SCORE DE PERTINENCE JURIDIQUE : ${pct} / 100`, "",
      ...S.results.flatMap((r, i) => [`ROUND ${i + 1} — ${r.name} : ${r.score}/20`, `  Argument : ${r.argument}`, ...r.ok.map(x => "  + " + x), ...r.ko.map(x => "  - " + x),
        ...(r.manques?.length ? [`  Textes à invoquer : ${refs(r.manques)}`] : []), ""]),
      "VERDICT", v.text, ...(v.citations?.length ? [`Textes appliqués : ${refs(v.citations)}`] : []), "",
      ...(v.conseils?.length ? ["CONSEILS", ...v.conseils.map(c => "  • " + c), ""] : []),
      "ANNOTATIONS DU RECRUTEUR", `  Gestion du stress : ${st}/5`, `  Posture et éloquence : ${po}/5`, `  Commentaires : ${document.getElementById("notes").value.trim() || "—"}`, "",
      "TRANSCRIPTION", ...S.log.map(l => `[${l.who}] ${l.text}`)
    ].join("\n");
  };
  ["stress", "posture", "notes"].forEach(id => document.getElementById(id).addEventListener("input", build));
  build();
  document.getElementById("again").onclick = renderIntro;
  document.getElementById("copy").onclick = e => {
    const box = document.getElementById("exportBox"), btn = e.currentTarget;
    const done = () => { btn.textContent = "Dossier copié"; setTimeout(() => btn.textContent = "Copier le dossier", 1800); };
    navigator.clipboard.writeText(box.value).then(done).catch(() => { box.select(); btn.textContent = "Texte sélectionné, faites Ctrl+C"; });
  };
  window.scrollTo({ top: 0, behavior: "smooth" });
}

renderIntro();
// Charge la base en arrière-plan après le premier affichage (panneau des codes et mode IA).
setTimeout(() => chargerBase().catch(() => {}), 600);
</script>
